name: Daily AI News Update

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点 = 北京时间 08:00
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install aiohttp beautifulsoup4 lxml
      
      - name: Step 1 - Generate daily news
        id: generate
        run: |
          echo "📝 步骤 1/4: 开始生成 AI 日报..."
          python skill_v12.py
          echo "✅ 步骤 1 完成：日报生成成功"
          echo "news_count=$(cat news_data.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["total_items"])')" >> $GITHUB_OUTPUT
        timeout-minutes: 5
      
      - name: Step 2 - Commit and push
        id: push
        run: |
          echo "📤 步骤 2/4: 推送代码到 GitHub..."
          git config user.name "AI Assistant"
          git config user.email "ai@example.com"
          git add -A
          git commit -m "Daily update $(date +\%Y-\%m-\%d)" || echo "No changes"
          git push
          echo "✅ 步骤 2 完成：代码已推送"
          echo "✅ 步骤 2 完成：代码已推送，触发 GitHub Pages 部署" >> $GITHUB_STEP_SUMMARY
        timeout-minutes: 3
      
      - name: Step 3 - Wait for GitHub Pages
        id: pages
        run: |
          echo "⏳ 步骤 3/4: 等待 GitHub Pages 部署..."
          echo "📄 GitHub Pages URL: https://wanibbo.github.io/ai-daily-news/"
          sleep 60
          echo "✅ 步骤 3 完成：GitHub Pages 部署完成"
          echo "✅ 步骤 3 完成：网站已更新" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      
      - name: Step 4 - Complete
        run: |
          echo "✅ 步骤 4/4: 日报生成完成"
          echo "📢 通知由 notify-on-push.yml 工作流在 push 后发送"
          echo "✅ 步骤 4 完成：日报生成完成" >> $GITHUB_STEP_SUMMARY
